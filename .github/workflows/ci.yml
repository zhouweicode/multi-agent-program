name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ruff
      - run: ruff check . --select E9,F63,F7,F82
      - run: python -m compileall -q agents app evaluation formatters graph models nodes repositories services skills tools scripts
      - run: node --check frontend/app.js
      - run: pytest -q
      - run: python -m scripts.evaluate_stage9_e2e
      - name: Agent golden-set regression gate
        run: python -m scripts.run_agent_evals --check --output .runtime/eval-report.json
      - name: Harness fault-injection regression gate
        run: python -m scripts.run_harness_evals --check --output .runtime/harness-eval-report.json
      - name: Expert report skill regression gate
        run: python -m scripts.run_expert_report_evals --check --output .runtime/expert-report-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-report
          path: |
            .runtime/eval-report.json
            .runtime/harness-eval-report.json
            .runtime/expert-report-eval.json
