name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt ruff
      - run: ruff check . --select E9,F63,F7,F82
      - run: python -m compileall -q agents app formatters graph models nodes repositories services tools scripts
      - run: node --check frontend/app.js
      - run: pytest -q
      - run: python -m scripts.evaluate_stage9_e2e
